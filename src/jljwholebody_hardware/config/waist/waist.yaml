# Waist parallel mechanism (电机轴平行于 y 轴，与脚踝的 x 轴电机不同)。
#
# 坐标系约定与人形机器人一致：向前 x，向左 y，向上 z。
#   - 平台姿态约定与脚踝相同：c_hat(c, pitch, roll) = Ry(pitch) * Rx(roll) * c
#     （先绕 x 轴转 roll，再绕 y 轴转 pitch）
#   - 电机 1（ra01/rb01/rc01）位于机身左侧（y>0），电机 2 位于右侧（y<0）。
#
# 几何参数来源：parallel_solver/config/waist.yaml。
# rod_length 未在源文件中给出，由零位 |rb - rc| 计算（两腿均为 0.071709 m），
# 此处显式写出以便核对。
#
# theta_range_1/theta_range_2 是机构角度 theta（电机角经 motor_direction/offset
# 变换后的机构角）的钳位范围，用于逆解分支选择与反馈钳位。零位（pitch=roll=0）
# 时物理装配分支为 theta=0；腰部解算器内代码姿态限制为
# pitch∈[-0.5,0.5]、roll∈[-0.2,0.2]（pitch 上限于 2026-08-26 调至 0.5）。
# 在该范围内可达 theta 约为 [-0.621, 0.638] rad，钳位范围 [-0.6, 0.8] 仍覆盖。
# 若实机装配发现零位对应另一分支（约 -1.52 rad），请调整这两个范围。
#
# 注意：pitch_range/roll_range 不会被解算器读取（YAML 中的数值为占位、待实机
# 确认）；姿态限制始终使用代码内默认值。
joint_type: "waist"
h0: [0, 0, 0]

ra01: [0, 0.0618, 0.075]
ra02: [0, -0.0618, 0.075]

rb01: [-0.08, 0.0651, 0.07482]
rb02: [-0.08, -0.0651, 0.07482]

rc01: [-0.07493, 0.0651, 0.00329]
rc02: [-0.07493, -0.0651, 0.00329]

rod_length: [0.071709, 0.071709]

m01: 0
m02: 0
# 电机方向（实机确认）：
#   - 垂直看向电机输出端，逆时针为正（DM 电机约定）。
#   - 电机 1 输出端朝机器人左侧（+y 侧），电机 2 输出端朝右侧（-y 侧），
#     朝向相反 ⇒ pitch 共模需要两电机数值角度异号。
#   - 实机测试（2026-08-26）：pitch 方向与期望相反，两项同时取反为 [1, -1]。
motor_direction: [1, -1]

theta_range_1: [-0.6, 0.8]
theta_range_2: [-0.6, 0.8]

# pitch_range: [-0.5, 0.8]   # 占位，解算器不读取，待实机确认
# roll_range:  [-0.3, 0.3]   # 占位，解算器不读取，待实机确认
